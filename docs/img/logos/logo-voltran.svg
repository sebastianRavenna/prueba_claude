<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="voltranGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background shape -->
  <rect x="2" y="10" width="60" height="60" rx="8" fill="url(#voltranGradient)"/>

  <!-- Lightning bolt symbol -->
  <path d="M42 18 L28 42 L36 42 L22 62 L48 35 L38 35 L50 18 Z"
        fill="url(#boltGradient)"
        stroke="#ffffff"
        stroke-width="1"/>

  <!-- Transformer coil lines -->
  <path d="M12 25 Q8 40 12 55" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M52 25 Q56 40 52 55" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Company name VOLTRAN -->
  <text x="75" y="38" font-family="'Oswald', Arial, sans-serif" font-size="28" font-weight="700" fill="#1a365d" letter-spacing="3">
    VOLTRAN
  </text>

  <!-- S.A. suffix -->
  <text x="75" y="58" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="400" fill="#2c5282" letter-spacing="1">
    S.A.
  </text>

  <!-- Tagline -->
  <text x="115" y="58" font-family="'Roboto', Arial, sans-serif" font-size="10" font-weight="300" fill="#718096" letter-spacing="1">
    TRANSFORMADORES INDUSTRIALES
  </text>

  <!-- Accent line -->
  <rect x="75" y="62" width="180" height="2" fill="url(#voltranGradient)" rx="1"/>
</svg>
