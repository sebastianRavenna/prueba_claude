        <div class="logos-container">

                <img src="img/logos/logo-voltran.svg" alt="VOLTRAN S.A." class="logo-voltran">
            </a>
            <div class="logo-divider"></div>
            <a href="index.html" class="logo-wrapper" aria-label="INDUTRAF S.R.L. - Inicio">
                <img src="img/logos/logo-indutraf.svg" alt="INDUTRAF S.R.L." class="logo-indutraf">
            </a>
        </div>

        <!-- Navigation -->
        <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link" data-translate="nav_home">

                <li class="nav-item">

                    </a>

                <li class="nav-item">
                    <a href="contacto.html" class="nav-link" data-translate="nav_contact">

                        <span>Contacto</span>
                    </a>
                </li>
            </ul>

            <!-- Language Toggle -->
            <div class="language-toggle" role="group" aria-label="Selector de idioma">
                <button type="button" class="lang-btn active" data-lang="es" aria-pressed="true">ES</button>
                <span class="lang-divider">|</span>
                <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
            </div>
        </nav>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Menú" aria-expanded="false" aria-controls="main-nav">
